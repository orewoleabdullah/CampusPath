<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CampusPath</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-container">
        <a href="/" class="logo">Campus<span>Path</span></a>
        <h1>Create your account</h1>
        <p>Start organizing your opportunities.</p>

        {% for message in get_flashed_messages() %}
            <p class="auth-message">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input id="username" name="username"
                   maxlength="50" required autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   minlength="8" required autocomplete="new-password">

            <label for="confirmation">Confirm password</label>
            <input id="confirmation" name="confirmation" type="password"
                   minlength="8" required autocomplete="new-password">

            <button type="submit">Create account</button>
        </form>

        <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </main>
</body>
</html>
